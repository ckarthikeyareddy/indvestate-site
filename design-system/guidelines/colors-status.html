<!doctype html><html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;margin:0}.l{font-family:var(--font-mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-muted);font-weight:500}.d{font-family:var(--font-mono);font-size:13px;color:var(--ink)}.n{font-size:13px;line-height:1.45;color:var(--ink-muted)}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:12px}.sw{display:flex;flex-direction:column;gap:6px;min-width:0}.chip{height:56px;border:1px solid var(--hairline)}.n{font-size:12px}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:#5CD68A"></div><div class="l" style="color:var(--ink)">verified · dark</div><div class="d" style="color:var(--ink-muted)">#5CD68A</div><div class="n">Document on file, check passed</div></div><div class="sw"><div class="chip" style="background:#1E7A45"></div><div class="l" style="color:var(--ink)">verified · light</div><div class="d" style="color:var(--ink-muted)">#1E7A45</div><div class="n">Same role on light</div></div><div class="sw"><div class="chip" style="background:#E8604C"></div><div class="l" style="color:var(--ink)">risk · dark</div><div class="d" style="color:var(--ink-muted)">#E8604C</div><div class="n">Flag, missing doc, risk memo</div></div><div class="sw"><div class="chip" style="background:#B43A2A"></div><div class="l" style="color:var(--ink)">risk · light</div><div class="d" style="color:var(--ink-muted)">#B43A2A</div><div class="n">Same role on light</div></div></div></body></html>
