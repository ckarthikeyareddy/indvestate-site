<!-- @dsCard group="Spacing" viewport="700x200" name="Depth & glow" subtitle="No shadows. Borders make depth. Two glows only." -->
<!doctype html><html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;margin:0}.l{font-family:var(--font-mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-muted);font-weight:500}.d{font-family:var(--font-mono);font-size:13px;color:var(--ink)}.n{font-size:13px;line-height:1.45;color:var(--ink-muted)}</style></head><body><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:24px;align-items:start"><div style="display:flex;flex-direction:column;gap:12px"><div style="height:64px;background:var(--carbon);border:1px solid var(--hairline)"></div><span class="l" style="color:var(--ink)">Elevation = hairline</span><span class="n">carbon on void + 1px border</span></div><div style="display:flex;flex-direction:column;gap:12px"><div style="height:64px;display:grid;place-items:center"><span style="width:14px;height:14px;border-radius:50%;background:var(--saffron);box-shadow:var(--glow-saffron)"></span></div><span class="l" style="color:var(--ink)">glow-saffron</span><span class="n">0 0 24px · 25% — primary hover, live marker</span></div><div style="display:flex;flex-direction:column;gap:12px"><div style="height:64px;display:grid;place-items:center"><span style="width:14px;height:14px;border-radius:50%;background:var(--signal);box-shadow:var(--glow-signal)"></span></div><span class="l" style="color:var(--ink)">glow-signal</span><span class="n">0 0 20px · 20% — verified ticks</span></div></div></body></html>
