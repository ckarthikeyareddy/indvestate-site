<!-- @dsCard group="Motion" viewport="700x260" name="Motion vocabulary" subtitle="Precise, never bouncy. Loops every 3s here" -->
<!doctype html><html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;margin:0}.l{font-family:var(--font-mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-muted);font-weight:500}.d{font-family:var(--font-mono);font-size:13px;color:var(--ink)}.n{font-size:13px;line-height:1.45;color:var(--ink-muted)}</style></head><body><div id="m" style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px"></div><script>
const items=[['reveal','<div class="iv-reveal" style="height:40px;background:var(--carbon);border:1px solid var(--hairline)"></div>'],['pulse-ring','<div style="height:40px;display:grid;place-items:center"><span style="position:relative;width:10px;height:10px;border-radius:50%;background:var(--saffron)"><span class="iv-pulse-ring" style="position:absolute;inset:0;border-radius:50%;background:var(--saffron)"></span></span></div>'],['border-draw','<div style="height:40px;display:flex;align-items:center"><div class="iv-border-draw" style="height:1px;width:100%;background:var(--ink)"></div></div>'],['stamp-in','<div style="height:40px;display:grid;place-items:center"><span class="iv-stamp-in iv-pill iv-pill--verified"><span class="iv-pill__tick"></span>VERIFIED</span></div>'],['check-in','<div style="display:flex;flex-direction:column;gap:4px">'+['EC pulled','OC on file','Exit priced'].map((t,i)=>'<span class="iv-check-in d" style="--i:'+i+';font-size:12px;color:var(--verified)">✓ <span style="color:var(--ink)">'+t+'</span></span>').join('')+'</div>'],['line-grow-down','<div style="height:56px;display:flex;justify-content:center"><div class="iv-line-grow-down" style="width:1px;height:100%;background:var(--signal)"></div></div>'],['slow-drift','<div style="height:40px;display:grid;place-items:center"><div class="iv-drift" style="width:40px;height:28px;border:1px solid var(--signal);background:var(--signal-faint)"></div></div>'],['count-up','<div class="iv-price" id="cu" style="height:40px;display:flex;align-items:center">0</div>']];
const m=document.getElementById('m');
function run(){m.innerHTML=items.map(([n,h])=>'<div style="display:flex;flex-direction:column;gap:10px;border:1px solid var(--hairline);padding:12px;min-height:110px;justify-content:space-between">'+h+'<span class="l">'+n+'</span></div>').join('');const el=document.getElementById('cu');let s=performance.now();(function f(t){const p=Math.min(1,(t-s)/1200);el.textContent=Math.round(41*(1-Math.pow(1-p,3)))+' / 44';if(p<1)requestAnimationFrame(f)})(s);}
run();if(!matchMedia('(prefers-reduced-motion: reduce)').matches)setInterval(run,3000);
</script></body></html>
