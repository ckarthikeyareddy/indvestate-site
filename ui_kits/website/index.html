<!doctype html><html data-theme="dark"><head><meta charset="utf-8"><title>INDVESTATE — Website</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
</head><body><div id="root"></div>
<script type="text/babel" src="kit-shared.jsx"></script>
<script type="text/babel" src="screen-home.jsx"></script>
<script type="text/babel" src="screen-drop.jsx"></script>
<script type="text/babel" src="screen-inspection.jsx"></script>
<script type="text/babel" src="screen-nri.jsx"></script>
<script type="text/babel">
const {Navbar,StatusPill}=window.INDVESTATEDesignSystem_26aecf;
function App(){
  const [route,setRoute]=React.useState(()=>localStorage.getItem('iv-kit-route')||'home');
  const [theme,setTheme]=React.useState(()=>localStorage.getItem('iv-kit-theme')||'dark');
  const go=r=>{setRoute(r);localStorage.setItem('iv-kit-route',r);window.scrollTo(0,0)};
  React.useEffect(()=>{document.documentElement.dataset.theme=theme;localStorage.setItem('iv-kit-theme',theme)},[theme]);
  const screens={home:HomeScreen,Drops:DropScreen,Inspection:InspectionScreen,'NRI desk':NriScreen};
  const S=screens[route]||HomeScreen;
  return <div>
    <div style={{position:'sticky',top:0,zIndex:10}}><Navbar links={['Drops','Inspection','NRI desk']} current={route} onNavigate={r=>go(screens[r]?r:'home')} status={<StatusPill kind="live-drop" label="Drop 01 live" />} cta={route==='Drops'?null:'Join the inside list'} onCta={()=>go('NRI desk')} /></div>
    <S key={route} go={go} />
    <Footer go={go} />
    <button onClick={()=>setTheme(theme==='dark'?'light':'dark')} className="iv-btn iv-btn--secondary iv-btn--sm iv-btn--mono" style={{position:'fixed',right:16,bottom:16,background:'var(--void)'}}>{theme==='dark'?'Light':'Dark'} theme</button>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
