<!doctype html><html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;margin:0}.l{font-family:var(--font-mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-muted);font-weight:500}.d{font-family:var(--font-mono);font-size:13px;color:var(--ink)}.n{font-size:13px;line-height:1.45;color:var(--ink-muted)}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:12px}.sw{display:flex;flex-direction:column;gap:6px;min-width:0}.chip{height:56px;border:1px solid var(--hairline)}.n{font-size:12px}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:#F6F4EE"></div><div class="l" style="color:var(--ink)">void</div><div class="d" style="color:var(--ink-muted)">#F6F4EE</div><div class="n">Page ground</div></div><div class="sw"><div class="chip" style="background:#FFFFFF"></div><div class="l" style="color:var(--ink)">carbon</div><div class="d" style="color:var(--ink-muted)">#FFFFFF</div><div class="n">Cards</div></div><div class="sw"><div class="chip" style="background:#EAE7DF"></div><div class="l" style="color:var(--ink)">graphite</div><div class="d" style="color:var(--ink-muted)">#EAE7DF</div><div class="n">Inputs, controls</div></div><div class="sw"><div class="chip" style="background:#0E1013"></div><div class="l" style="color:var(--ink)">ink</div><div class="d" style="color:var(--ink-muted)">#0E1013</div><div class="n">Primary text</div></div><div class="sw"><div class="chip" style="background:#5B5F66"></div><div class="l" style="color:var(--ink)">ink-muted</div><div class="d" style="color:var(--ink-muted)">#5B5F66</div><div class="n">Secondary text</div></div><div class="sw"><div class="chip" style="background:#8D9097"></div><div class="l" style="color:var(--ink)">ink-faint</div><div class="d" style="color:var(--ink-muted)">#8D9097</div><div class="n">Decor / disabled</div></div><div class="sw"><div class="chip" style="background:rgba(14,16,19,.12)"></div><div class="l" style="color:var(--ink)">hairline</div><div class="d" style="color:var(--ink-muted)">12% ink</div><div class="n">Every border</div></div></div></body></html>
