<!-- @dsCard group="Spacing" viewport="700x330" name="Spacing scale" subtitle="4-based: --space-1 … --space-9" -->
<!doctype html><html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;margin:0}.l{font-family:var(--font-mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-muted);font-weight:500}.d{font-family:var(--font-mono);font-size:13px;color:var(--ink)}.n{font-size:13px;line-height:1.45;color:var(--ink-muted)}</style></head><body><div style="display:flex;flex-direction:column;gap:6px"><div style="display:grid;grid-template-columns:90px 50px 1fr;gap:12px;align-items:center"><span class="l">space-1</span><span class="d">4</span><span style="height:12px;width:16px;max-width:100%;background:var(--signal-faint);border:1px solid var(--signal)"></span></div><div style="display:grid;grid-template-columns:90px 50px 1fr;gap:12px;align-items:center"><span class="l">space-2</span><span class="d">8</span><span style="height:12px;width:32px;max-width:100%;background:var(--signal-faint);border:1px solid var(--signal)"></span></div><div style="display:grid;grid-template-columns:90px 50px 1fr;gap:12px;align-items:center"><span class="l">space-3</span><span class="d">12</span><span style="height:12px;width:48px;max-width:100%;background:var(--signal-faint);border:1px solid var(--signal)"></span></div><div style="display:grid;grid-template-columns:90px 50px 1fr;gap:12px;align-items:center"><span class="l">space-4</span><span class="d">16</span><span style="height:12px;width:64px;max-width:100%;background:var(--signal-faint);border:1px solid var(--signal)"></span></div><div style="display:grid;grid-template-columns:90px 50px 1fr;gap:12px;align-items:center"><span class="l">space-5</span><span class="d">24</span><span style="height:12px;width:96px;max-width:100%;background:var(--signal-faint);border:1px solid var(--signal)"></span></div><div style="display:grid;grid-template-columns:90px 50px 1fr;gap:12px;align-items:center"><span class="l">space-6</span><span class="d">32</span><span style="height:12px;width:128px;max-width:100%;background:var(--signal-faint);border:1px solid var(--signal)"></span></div><div style="display:grid;grid-template-columns:90px 50px 1fr;gap:12px;align-items:center"><span class="l">space-7</span><span class="d">48</span><span style="height:12px;width:192px;max-width:100%;background:var(--signal-faint);border:1px solid var(--signal)"></span></div><div style="display:grid;grid-template-columns:90px 50px 1fr;gap:12px;align-items:center"><span class="l">space-8</span><span class="d">64</span><span style="height:12px;width:256px;max-width:100%;background:var(--signal-faint);border:1px solid var(--signal)"></span></div><div style="display:grid;grid-template-columns:90px 50px 1fr;gap:12px;align-items:center"><span class="l">space-9</span><span class="d">96</span><span style="height:12px;width:384px;max-width:100%;background:var(--signal-faint);border:1px solid var(--signal)"></span></div></div></body></html>
