<!doctype html><html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;margin:0}.l{font-family:var(--font-mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-muted);font-weight:500}.d{font-family:var(--font-mono);font-size:13px;color:var(--ink)}.n{font-size:13px;line-height:1.45;color:var(--ink-muted)}</style></head><body><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px"><div style="display:flex;flex-direction:column;gap:8px"><div style="height:56px;border:1px solid var(--hairline-strong);background:var(--carbon);border-radius:0"></div><span class="l" style="color:var(--ink)">radius-none · 0</span><span class="n">Cards, media, buttons</span></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:56px;border:1px solid var(--hairline-strong);background:var(--carbon);border-radius:2px"></div><span class="l" style="color:var(--ink)">radius-input · 2px</span><span class="n">Inputs, checkboxes</span></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:56px;border:1px solid var(--hairline-strong);background:var(--carbon);border-radius:999px"></div><span class="l" style="color:var(--ink)">radius-pill · 999px</span><span class="n">StatusPill only</span></div></div></body></html>
